version: 1
repo:
  name: main
  root: /home/nicolas/prog/workforest/example/main
worktrees:
  - path: /home/nicolas/prog/workforest/example/main
    branch: main
    isMain: true
  - path: /home/nicolas/prog/workforest/example/feature/a
    branch: a
    isMain: false
  - path: /home/nicolas/prog/workforest/example/feature/c
    branch: c
    isMain: false
    ignoreShared:
      - google_service_key.json
shared:
  # source path in the main worktree: target path to create in other worktrees
  .env: .env
  assets/: assets/
  google_service_key.json:
    target: google_service_key.json
    copy: true
